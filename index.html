<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>secarikkertas</title>
    <meta name="description" content="Ruang berbagi cerpen dan artikel kepenulisan untuk komunitas penulis Indonesia. Baca, tulis, dan diskusikan karya sastra bersama." />
    <meta name="keywords" content="cerpen, komunitas menulis, artikel kepenulisan, cerita pendek indonesia, platform menulis" />
    <link rel="canonical" href="https://secarikkertas.id/" />

    <!-- Open Graph, biar tampilan bagus saat dibagikan ke WhatsApp/Facebook/dll -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="secarikkertas" />
    <meta property="og:description" content="Ruang berbagi cerpen dan artikel kepenulisan untuk komunitas penulis Indonesia." />
    <meta property="og:url" content="https://secarikkertas.id/" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:image" content="https://secarikkertas.id/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="secarikkertas" />
    <meta name="twitter:description" content="Ruang berbagi cerpen dan artikel kepenulisan untuk komunitas penulis Indonesia." />

    <meta name="robots" content="index, follow" />

    <!-- Anti-kedip tema gelap: dijalankan sebelum apa pun dirender, supaya
         kalau pengguna sudah memilih mode gelap, halaman tidak sempat
         "kedip" tema terang dulu sesaat sebelum React mengambil alih.
         Logikanya HARUS sama persis dengan bacaTemaAwal() di
         src/context/ThemeContext.jsx — kalau salah satu diubah, ubah juga
         yang satunya. -->
    <script>
      (function () {
        try {
          var tersimpan = localStorage.getItem('sk_tema')
          var gelap = tersimpan === 'gelap' || (!tersimpan && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (gelap) document.documentElement.classList.add('dark')

          // Sama polanya dengan tema gelap di atas, untuk "Mode Nyaman"
          // (kurangi animasi & kursor kustom) — lihat
          // src/context/AccessibilityContext.jsx untuk detailnya.
          var modeNyaman = localStorage.getItem('sk_mode_nyaman')
          var nyaman = modeNyaman === '1' || (modeNyaman === null && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
          if (nyaman) document.documentElement.classList.add('mode-nyaman')
        } catch (e) {
          // localStorage bisa saja diblokir (mode privat ketat dll) — kalau
          // gagal, biarkan saja default ke tema terang, bukan error fatal.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
